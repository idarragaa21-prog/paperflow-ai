<!doctype html><html lang="es"><head><meta charset="utf-8">
<style>
@page { margin:0; size:1080px 1350px; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; text-rendering:geometricPrecision; }
html,body { width:1080px; height:1350px; }
.slide {
  position:relative; width:1080px; height:1350px; overflow:hidden;
  background:#F4F1EA; color:#1B2830;
  padding:92px 96px 84px;
  display:flex; flex-direction:column;
}
.slide.dark { background:#0E3541; color:#F4F1EA; }
.slide.dark .muted { color:#B9C6C9; }
.grain { position:absolute; inset:0; pointer-events:none; opacity:0.5;
  background-image:radial-gradient(rgba(0,0,0,0.05) 0.5px, transparent 0.5px);
  background-size:4px 4px; }
.slide.dark .grain { background-image:radial-gradient(rgba(255,255,255,0.045) 0.5px, transparent 0.5px); }

/* header */
.top { display:flex; justify-content:space-between; align-items:center; z-index:3; }
.brand { display:flex; align-items:center; gap:16px; }
.emblem { width:38px; height:38px; }
.wordmark { font-family:'Playfair Display', serif; font-weight:700; font-size:27px; letter-spacing:5px; }
.wordmark .co { color:#B08A4F; }
.slide.dark .wordmark .co { color:#B08A4F; }
.top-right { font-family:'Libre Franklin', sans-serif; font-size:12.5px; letter-spacing:3px; font-weight:600;
  text-transform:uppercase; color:#5E6E74; }
.slide.dark .top-right { color:#8FA3A7; }
.rule { height:1px; background:currentColor; opacity:0.16; margin:26px 0 0; z-index:3; }
.rule.gold { background:#B08A4F; opacity:0.9; height:2px; width:64px; margin:0; }

/* body area */
.body { flex:1; display:flex; flex-direction:column; justify-content:center; z-index:3; position:relative; }
.kicker { font-family:'Libre Franklin', sans-serif; font-weight:700; font-size:15px; letter-spacing:4.5px;
  text-transform:uppercase; color:#1E5A66; margin-bottom:30px; display:flex; align-items:center; gap:18px; }
.slide.dark .kicker { color:#B08A4F; }
.kicker::before { content:""; width:44px; height:2px; background:currentColor; opacity:0.85; }

h1 { font-family:'Playfair Display', serif; font-weight:800; line-height:1.06; letter-spacing:-0.5px; }
.t-hero  { font-size:76px; }
.t-xl    { font-size:62px; }
.t-lg    { font-size:52px; }
h1 em { font-style:italic; color:#1E5A66; }
.slide.dark h1 em { color:#B08A4F; }

.lead { font-family:'EB Garamond', serif; font-size:34px; line-height:1.48; color:#1B2830; margin-top:34px; max-width:820px; }
.slide.dark .lead { color:#E7E1D4; }
.lead b { font-weight:600; color:#1E5A66; }
.slide.dark .lead b { color:#B08A4F; }
.muted { color:#5E6E74; }

.flag { margin-top:40px; border-left:3px solid #B08A4F; padding:6px 0 6px 22px;
  font-family:'Libre Franklin', sans-serif; font-size:19px; line-height:1.5; font-weight:500; color:#1B2830; max-width:760px; }
.slide.dark .flag { color:#E7E1D4; }

/* two column confirm/challenge */
.cols { display:grid; grid-template-columns:1fr 1fr; gap:34px; margin-top:44px; }
.card { border-top:2px solid currentColor; padding-top:20px; }
.card .lbl { font-family:'Libre Franklin', sans-serif; font-size:14px; font-weight:700; letter-spacing:3px;
  text-transform:uppercase; margin-bottom:14px; }
.card.ok  { color:#1E5A66; }
.card.no  { color:#9C4A38; }
.card p { font-family:'EB Garamond', serif; font-size:27px; line-height:1.4; color:#1B2830; }

/* stat */
.stat { font-family:'Playfair Display', serif; font-weight:800; font-size:210px; line-height:0.9;
  letter-spacing:-4px; color:#9C4A38; }
.slide.dark .stat { color:#B08A4F; }
.stat-label { font-family:'EB Garamond', serif; font-size:34px; line-height:1.4; margin-top:18px; max-width:720px; }

/* checklist rows */
.rows { margin-top:20px; }
.row { display:flex; gap:20px; align-items:flex-start; padding:22px 0; border-bottom:1px solid rgba(27,40,48,0.12); }
.row:last-child { border-bottom:none; }
.row .n { font-family:'Libre Franklin', sans-serif; font-weight:700; font-size:16px; color:#B08A4F; min-width:34px; padding-top:6px; letter-spacing:1px; }
.row p { font-family:'EB Garamond', serif; font-size:29px; line-height:1.32; }
.row p b { font-weight:600; color:#1E5A66; }

/* question box (final) */
.qbox { margin-top:40px; border:1px solid rgba(244,241,234,0.28); border-radius:2px;
  padding:32px 34px; }
.qbox .qk { font-family:'Libre Franklin', sans-serif; font-size:13px; letter-spacing:3px; font-weight:700;
  text-transform:uppercase; color:#B08A4F; margin-bottom:16px; }
.qbox p { font-family:'EB Garamond', serif; font-style:italic; font-size:33px; line-height:1.42; color:#F4F1EA; }

/* footer */
.foot { display:flex; justify-content:space-between; align-items:flex-end; z-index:3;
  font-family:'Libre Franklin', sans-serif; font-size:13px; letter-spacing:2px; text-transform:uppercase; }
.foot .l { color:#5E6E74; font-weight:500; }
.foot .handle { text-transform:none; letter-spacing:0.5px; font-weight:600; color:#1E5A66; }
.slide.dark .foot .handle { color:#B08A4F; }
.slide.dark .foot .l { color:#8FA3A7; }
.foot .r { display:flex; align-items:center; gap:12px; color:#1B2830; font-weight:700; }
.slide.dark .foot .r { color:#F4F1EA; }
.foot .r .num { font-family:'Playfair Display', serif; font-size:19px; letter-spacing:1px; }
.foot .r .of { color:#B08A4F; }

/* decorative motif */
.motif { position:absolute; z-index:1; color:#1B2830; }
.slide.dark .motif { color:#F4F1EA; }
.motif.br { right:-40px; bottom:78px; width:360px; }
.motif.tr { right:70px; top:150px; width:300px; }
.src { position:absolute; left:96px; bottom:150px; font-family:'Libre Franklin', sans-serif; font-size:11.5px;
  letter-spacing:1.5px; color:#5E6E74; text-transform:uppercase; z-index:3; opacity:0.85; }
</style></head>
<body><div class="slide">
<div class="grain"></div>
<div class="motif tr" style="opacity:0.07"><svg viewBox="0 0 260 360" fill="none" stroke="currentColor" stroke-width="2.0"
      stroke-linecap="round" stroke-linejoin="round" opacity="1.0">

      <path d="M214 22 C210 96 210 176 206 236 C205 270 202 300 196 316"/>
      <!-- talar dome -->
      <path d="M96 300 C112 286 150 286 170 300 C184 310 188 328 182 344 C150 356 120 356 90 344 C82 330 84 312 96 300"/>
      <!-- syndesmosis hatch -->
      <path d="M156 214 L182 210 M156 226 L182 222 M158 238 L184 234" stroke-width="1.4"/>
    </svg></div>
<div class="top">
      <div class="brand"><svg class="emblem" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6">
  <rect x="3" y="3" width="34" height="34" rx="2" opacity="0.9"/>
  <path d="M13 12 h14 M13 20 h10 M13 28 h14" stroke-width="2.2"/>
  <line x1="20" y1="3" x2="20" y2="0.5" opacity="0"/>
</svg><span class="wordmark">EVIDEN<span class="co">TIA</span></span></div>
      <div class="top-right">Pie&nbsp;&amp;&nbsp;Tobillo · Lectura Crítica</div>
    </div>
    <div class="rule"></div>
<div class="body">
  <div class="kicker">Evidencia vs. práctica</div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="stat">40%</div>
  </div>
  <p class="stat-label">de <b>malreducciones de la sindesmosis</b> en TC postoperatoria. El problema no suele ser qué implante elegimos — es la reducción que logramos.</p>
</div>
<div class="rule" style="margin-bottom:22px;"></div>
    <div class="foot">
      <div class="l">Medicina Basada en Evidencia&nbsp; ·&nbsp; <span class="handle">@evidentia_co</span></div>
      <div class="r"><span class="num">08</span><span class="of">/ 10</span></div>
    </div>
</div></body></html>
