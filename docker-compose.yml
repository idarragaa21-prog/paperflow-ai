services:
  postgres:
    image: postgres:16
    container_name: paperflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperflow_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - researchconsole_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: paperflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - researchconsole_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: paperflow-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - paperflow_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:6333/collections >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  ollama:
    image: ollama/ollama:0.6.2
    container_name: paperflow-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - paperflow_ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/api/tags >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: paperflow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-DEV_ONLY_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-DEV_ONLY_MINIO_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - paperflow_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-DEV_ONLY_MINIO_USER} ${MINIO_ROOT_PASSWORD:-DEV_ONLY_MINIO_PASSWORD} &&
      mc mb --ignore-existing local/${S3_BUCKET:-paperflow-artifacts}
      "
    restart: "no"

  grobid:
    image: lfoppiano/grobid:0.8.1
    container_name: paperflow-grobid
    ports:
      - "${GROBID_PORT:-8070}:8070"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8070/api/isalive | grep -qi true"]
      interval: 15s
      timeout: 10s
      retries: 20

  r-engine:
    build:
      context: ./r_engine
    container_name: paperflow-r-engine
    ports:
      - "${R_ENGINE_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8010/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: paperflow-backend
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      r-engine:
        condition: service_healthy
      grobid:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-paperflow_ai}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      R_ENGINE_URL: http://r-engine:8010
      GROBID_URL: http://grobid:8070
      S3_ENDPOINT_URL: http://minio:9000
      STORAGE_BACKEND: s3
      METRICS_ENABLED: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  worker-documents:
    build:
      context: ./backend
    container_name: paperflow-worker-documents
    profiles: ["full"]
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-paperflow_ai}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      R_ENGINE_URL: http://r-engine:8010
      GROBID_URL: http://grobid:8070
      S3_ENDPOINT_URL: http://minio:9000
      STORAGE_BACKEND: s3
      OTEL_SERVICE_NAME: paperflow-worker-documents
      WORKER_QUEUES: documents
    command: ["python", "-m", "app.workers.worker"]

  worker-presentations:
    build:
      context: ./backend
    container_name: paperflow-worker-presentations
    profiles: ["full"]
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-paperflow_ai}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      R_ENGINE_URL: http://r-engine:8010
      GROBID_URL: http://grobid:8070
      S3_ENDPOINT_URL: http://minio:9000
      STORAGE_BACKEND: s3
      OTEL_SERVICE_NAME: paperflow-worker-presentations
      WORKER_QUEUES: presentations
    command: ["python", "-m", "app.workers.worker"]

  worker-analysis:
    build:
      context: ./backend
    container_name: paperflow-worker-analysis
    profiles: ["full"]
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-paperflow_ai}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      R_ENGINE_URL: http://r-engine:8010
      GROBID_URL: http://grobid:8070
      S3_ENDPOINT_URL: http://minio:9000
      STORAGE_BACKEND: s3
      OTEL_SERVICE_NAME: paperflow-worker-analysis
      WORKER_QUEUES: analysis
    command: ["python", "-m", "app.workers.worker"]

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: paperflow-prometheus
    profiles: ["full"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      backend:
        condition: service_started

  grafana:
    image: grafana/grafana:11.5.2
    container_name: paperflow-grafana
    profiles: ["full"]
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  researchconsole_pgdata:
  researchconsole_redisdata:
  paperflow_qdrant:
  paperflow_ollama:
  paperflow_minio:
