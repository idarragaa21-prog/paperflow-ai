[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metaforge"
version = "2.13.0"
description = "Local-first research workspace: question, protocol, meta-analysis and manuscript drafting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Diego Alejandro Idarraga" }]
keywords = ["meta-analysis", "epidemiology", "forest-plot", "evidence-synthesis", "statistics"]
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "svglib>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.26"]
# Higher-fidelity figure rasterisation for Word export. Needs the system
# 'cairo' library (macOS: `brew install cairo`). Optional — svglib is the
# default and needs no system libraries.
hifig = ["cairosvg>=2.7"]

[project.scripts]
metaforge = "metaforge.cli:main"

[tool.setuptools]
packages = ["metaforge"]

[tool.setuptools.package-data]
metaforge = ["../web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
