services:
  - type: web
    name: paperflow-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: paperflow-db
          property: connectionString
      - key: REDIS_URL
        value: redis://red-placeholder:6379
      - key: STORAGE_BACKEND
        value: s3
      - key: GROBID_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: openclaw
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
      - key: COOKIE_SAMESITE
        value: "none"
      - key: PROJECT_DEFAULT_RUNTIME_MODE
        value: cloud_enabled
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: OCR_ENABLED
        value: "false"

databases:
  - name: paperflow-db
    databaseName: paperflow_ai
    user: paperflow
    plan: free
    region: oregon
