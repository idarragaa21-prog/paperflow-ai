services:
  - type: web
    name: paperflow-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: paperflow-db
          property: connectionString
      - key: REDIS_URL
        value: redis://red-placeholder:6379
      # ── Storage ──────────────────────────────────────────────────────────────
      # Set STORAGE_BACKEND=s3 and provide S3 credentials to persist files
      # across deploys. The filesystem backend uses /tmp and loses data on restart.
      #
      # Required env vars to set manually in the Render dashboard when using S3:
      #   STORAGE_BACKEND     → s3
      #   S3_ENDPOINT_URL     → https://s3.amazonaws.com  (or MinIO/Wasabi/DO Spaces endpoint)
      #   S3_ACCESS_KEY       → your access key
      #   S3_SECRET_KEY       → your secret key
      #   S3_BUCKET           → paperflow-artifacts  (create bucket first)
      #   S3_REGION           → us-east-1  (or your bucket region)
      #   S3_FORCE_PATH_STYLE → false  (true only for MinIO)
      - key: STORAGE_BACKEND
        value: filesystem   # ← change to "s3" after setting S3 vars above
      - key: STORAGE_BASE_PATH
        value: /tmp/paperflow_data   # unused when STORAGE_BACKEND=s3
      - key: GROBID_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: openclaw
      - key: BACKEND_CORS_ORIGINS
        value: '["https://idarragaa21-prog.github.io","http://localhost:5173","http://localhost:3000"]'
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: OCR_ENABLED
        value: "false"

databases:
  - name: paperflow-db
    databaseName: paperflow_ai
    user: paperflow
    plan: free
    region: oregon
