name: ci

on:
  push:
    branches:
      - master
      - main
      - "codex/**"
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPERFLOW_DISABLE_DOTENV: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        run: |
          . .venv/bin/activate
          pytest -q
      - name: Run quality benchmarks
        run: |
          . .venv/bin/activate
          python scripts/run_quality_benchmarks.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config validation
        run: docker compose config >/tmp/docker-compose.rendered.yml
      - name: Start required runtime
        run: docker compose up -d postgres redis qdrant ollama minio minio-init grobid r-engine
      - name: Verify required runtime
        run: |
          docker compose ps
          docker compose exec -T postgres pg_isready -U postgres -d paperflow_ai
          docker compose exec -T redis redis-cli ping
          curl -fsS http://127.0.0.1:6333/collections >/dev/null
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null
          curl -fsS http://127.0.0.1:8070/api/isalive >/dev/null
          curl -fsS http://127.0.0.1:8010/health >/dev/null
      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
