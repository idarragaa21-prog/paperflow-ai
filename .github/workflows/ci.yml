name: CI

on:
  push:
    branches: [master, feat/*, fix/*]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAPERFLOW_DISABLE_DOTENV: "1"
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paperflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d paperflow_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python scripts/ci_run_pytest_files.py
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/paperflow_test"
          SECRET_KEY: "ci-test-secret"
          REDIS_URL: "redis://localhost:6379/0"
          STORAGE_BACKEND: "filesystem"
          STORAGE_BASE_PATH: "/tmp/paperflow_test"
          GROBID_ENABLED: "false"
          RATE_LIMIT_ENABLED: "false"
          LLM_PROVIDER: "openclaw"
          OCR_ENABLED: "false"
          PYTEST_FILE_TIMEOUT_SECONDS: "300"

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit & integration tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint -- --max-warnings 0

  smoke-e2e:
    name: Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    env:
      PLAYWRIGHT_BASE_URL: "http://127.0.0.1:5173"
      PLAYWRIGHT_API_URL: "http://127.0.0.1:8000"
      PAPERFLOW_SKIP_GROBID_WAIT: "1"
      # Use the Chrome preinstalled on the runner image; downloading browsers
      # from the Playwright CDN has repeatedly hung on degraded runner egress.
      PLAYWRIGHT_CHANNEL: "chrome"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create backend virtualenv
        run: |
          python -m venv backend/.venv
          source backend/.venv/bin/activate
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run stable browser smoke
        working-directory: frontend
        run: npm run e2e:smoke

      - name: Stop local stack
        if: always()
        run: scripts/dev_down.sh
